    /* Critical fix: ensure tile canvas stays absolute under any cascade */
    .tile-canvas { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0 !important; pointer-events: none !important; }
    .tile > *:not(.tile-canvas) { position: relative; z-index: 1; }
    .cta-canvas { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0 !important; display: block !important; }
    html.no-anim *, html.no-anim *::before, html.no-anim *::after { animation: none !important; transition: none !important; }
    html.slow-anim * { animation-duration: 2.2s !important; transition-duration: .9s !important; }
  </style>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEDLA × Jotform | Digitalización y Automatización</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#C9A84C',
            'gold-light': '#D4BA6E',
            'gold-dark': '#B89635',
            charcoal: '#1A1A2E',
            'charcoal-light': '#2A2A42',
            'gray-light': '#F5F5F5',
            'text-dark': '#2D2D2D',
            'text-mute': '#666666',
            navy: {
              800: '#1E293B',
              900: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">


@layer utilities {
  /* Artistic Flair premium utilities */
  .bg-gradient-gold {
    background: linear-gradient(135deg, #D4AF37 0%, #B8941D 100%);
  }

  .bg-gradient-champagne {
    background: linear-gradient(to bottom, #FFFFFF 0%, #F7F3E3 100%);
  }

  .card-shadow {
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
  }

  .glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid #F4E4C1;
  }

  /* Custom Interactive Hero styles */
  @keyframes heroAurora {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hero-section {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
      -45deg,
      #ffffff,
      #fdfaf5,
      #f9f4e8,
      #fdfaf5,
      #ffffff,
      #faf7ee,
      #ffffff
    );
    background-size: 400% 400%;
    animation: heroAurora 18s ease infinite;
    overflow: hidden;
  }

  .hero-gradient-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(
        ellipse 600px 420px at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(212, 175, 55, 0.28) 0%,
        rgba(212, 175, 55, 0.12) 40%,
        transparent 65%
      ),
      radial-gradient(
        ellipse 700px 550px at 8% 90%,
        rgba(244, 228, 193, 0.22) 0%,
        transparent 55%
      ),
      radial-gradient(
        ellipse 550px 400px at 94% 6%,
        rgba(212, 175, 55, 0.14) 0%,
        transparent 50%
      );
    transition: background 0.08s ease;
    pointer-events: none;
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 900px;
    padding: 0 40px;
  }

  /* Infinite Scroll Animations */
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes scrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes scrollRight {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  .carousel-track {
    display: flex;
    gap: 80px;
    animation: scroll 30s linear infinite;
  }

  .carousel-track:hover {
    animation-play-state: paused;
  }

  .carousel-1 {
    animation: scrollLeft 40s linear infinite;
  }

  .carousel-2 {
    animation: scrollRight 35s linear infinite;
  }

  .carousel-3 {
    animation: scrollLeft 45s linear infinite;
  }

  .carousel-1:hover, .carousel-2:hover, .carousel-3:hover {
    animation-play-state: paused !important;
  }

  /* Premium shimmer shine effect */
  .shimmer-bg {
    position: relative;
    overflow: hidden;
  }
  .shimmer-bg::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 30%;
    height: 200%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.1) 20%,
      rgba(255, 255, 255, 0.3) 60%,
      transparent 100%
    );
    transform: rotate(30deg);
    animation: shimmer 4s infinite linear;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% {
      left: -60%;
    }
    100% {
      left: 140%;
    }
  }

  /* Glow effect */
  .glow-gold {
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
  }


}


  </style>
</head>

<body class="bg-gray-light font-sans text-text-dark selection:bg-gold/30 antialiased overflow-x-hidden">
  <div id="root"></div>

  <!-- Load React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  
  <!-- Load Lucide React UMD -->
  <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>

  <!-- Load Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <!-- App Code -->
  <script type="text/babel" data-presets="react,typescript" src="app.jsx?v=1"></script>
</body>
</html>
